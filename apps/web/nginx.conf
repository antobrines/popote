# Sert la PWA et relaie /api vers le backend : tout est sur la même origine,
# ce qui garde le cookie de session en SameSite=Strict et évite toute configuration CORS.
#
# En production ce nginx est lui-même derrière un reverse proxy qui termine le HTTPS
# (Traefik avec Dokploy) : il lui fait confiance pour le protocole d'origine.

# Protocole vu par le navigateur : celui annoncé par le proxy amont s'il y en a un.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Sans effet en HTTP (développement local) ; en HTTPS, le navigateur n'accepte plus de revenir en clair.
  add_header Strict-Transport-Security "max-age=31536000" always;
  # La caméra sert uniquement au scan des codes-barres.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    # L'adresse de l'API est résolue à chaque requête par le DNS de Docker : nginx démarre même si
    # l'API n'est pas encore là, et la retrouve après un redéploiement qui change son adresse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Les en-têtes de sécurité sont posés une seule fois, par ce serveur (voir plus haut).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
  }

  # Le service worker et son manifeste ne doivent jamais être servis depuis un cache HTTP,
  # sinon les mises à jour de l'application n'arrivent pas.
  location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|index\.html|manifest\.webmanifest)$ {
    expires -1;
  }

  # Fichiers au nom haché par le build : cache long.
  location ~* \.(?:js|css|woff2)$ {
    expires 1y;
    access_log off;
  }

  location /icons/ {
    expires 30d;
    access_log off;
  }

  # Application monopage : toute autre URL renvoie la coquille.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
